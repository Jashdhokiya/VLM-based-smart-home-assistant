# ═══════════════════════════════════════════════════════════════════════
# Mosquitto MQTT Broker — INOT Mark1 Configuration
#
# Two listeners:
#   TCP  1883   — Python clients, ESP32
#   WS   9001   — Browser digital twin (mqtt.js over WebSocket)
# ═══════════════════════════════════════════════════════════════════════

# ── Persistence ───────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# ── Listener 1: TCP (default) ─────────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# ── Listener 2: WebSocket ─────────────────────────────────────────────
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# ── Retained messages & QoS ──────────────────────────────────────────
max_inflight_messages 20
max_queued_messages 1000
